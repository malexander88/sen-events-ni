plugins {
    id 'com.android.application'
}

// Release signing: secrets live in android/keystore.properties (git-ignored) or the file named
// by the KEYSTORE_PROPERTIES env var. Without it, release builds are produced unsigned.
def keystorePropsFile = System.getenv('KEYSTORE_PROPERTIES') ? file(System.getenv('KEYSTORE_PROPERTIES')) : rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'com.senevents.ni'
    compileSdk 36

    defaultConfig {
        applicationId "com.senevents.ni"
        minSdk 24
        targetSdk 36
        versionCode 202
        versionName "2.0.2"
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX — plain framework WebView to keep the APK tiny and dependency-free
}
