plugins {
    id 'com.android.application'
}

android {
    namespace 'com.senevents.ni'
    compileSdk 34

    defaultConfig {
        applicationId "com.senevents.ni"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX — plain framework WebView to keep the APK tiny and dependency-free
}
