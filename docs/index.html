<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#3f7f7a" />
  <meta name="description" content="SEN and autism-friendly events and places in County Antrim and County Down" />
  <title>SEN Events NI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">♥</span>
      <div>
        <h1>SEN Events NI</h1>
        <p class="subtitle">Calm days out across Antrim &amp; Down</p>
      </div>
    </div>
    <nav class="chips" id="quick-chips" aria-label="Quick filters">
      <button class="chip" data-q="near" aria-pressed="false">📍 Near me</button>
      <button class="chip" data-q="weekend" aria-pressed="false">📅 This weekend</button>
      <button class="chip" data-q="free" aria-pressed="false">🆓 Free</button>
      <button class="chip" data-q="sen" aria-pressed="false">💙 SEN only</button>
      <button class="chip" data-q="new" aria-pressed="false">✨ New</button>
      <button class="chip" data-q="saved" aria-pressed="false">♥ Saved</button>
    </nav>
    <nav class="chips chips-secondary" id="area-chips" aria-label="Area"></nav>
    <nav class="chips chips-secondary" id="type-chips" aria-label="Type"></nav>
  </header>

  <p id="status" class="status" role="status"></p>
  <main id="list" class="event-list" aria-live="polite">
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
  </main>

  <section id="detail" class="detail" hidden aria-modal="true" role="dialog"></section>

  <footer class="app-footer">
    <p>Past events hide automatically. The list updates when you're online.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
