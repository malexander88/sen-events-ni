name: Parent review
description: Share how a visit went, to help other families. Reviews are checked before they appear in the Out & About NI app.
title: "Review: "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping other families! Reviews are read by a person before they're published in the app.
        Please don't include children's names, photos or other personal details.
  - type: input
    id: event_id
    attributes:
      label: Event ID
      description: Filled in by the app. Leave as is.
    validations:
      required: true
  - type: input
    id: event_name
    attributes:
      label: Event or place
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Rating
      options:
        - "5 - Brilliant"
        - "4 - Good"
        - "3 - OK"
        - "2 - Not great"
        - "1 - Poor"
    validations:
      required: true
  - type: input
    id: visited
    attributes:
      label: When did you go? (optional)
      placeholder: e.g. Nov 2026
  - type: textarea
    id: review
    attributes:
      label: Your review
      description: What was it like? What worked or didn't for your child?
    validations:
      required: true
  - type: textarea
    id: sen_notes
    attributes:
      label: Tips for SEN families (optional)
      description: e.g. noise level, queues, quiet space, parking, staff understanding.
  - type: input
    id: name
    attributes:
      label: Name to show (optional)
      description: First name or initials only, e.g. "Sarah, mum of 2". Leave blank to show "A parent".
  - type: checkboxes
    id: consent
    attributes:
      label: Publishing
      options:
        - label: I'm happy for this review to be shown publicly in the app.
          required: true
