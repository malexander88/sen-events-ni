<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#173766" id="theme-color" />
  <meta name="description" content="SEN and autism-friendly events and places across Northern Ireland" />
  <title>Out &amp; About NI</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
    <script>
    // v1.8.0 compact layout. v1.7.3: apply saved theme before CSS paints (no flash). 'auto' | 'light' | 'dark'
    (function () {
      var m = 'auto'; try { m = localStorage.getItem('sen-events-ni-theme-v1') || 'auto'; } catch (e) {}
      if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.backgroundColor = dark ? '#0f1726' : '#fffaf0';
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand brand-slim">
      <img class="logo logo-img" src="icon-192.png" alt="" aria-hidden="true" width="28" height="28">
      <h1>Out &amp; About NI</h1>
      <div class="hdr-actions">
        <button id="plan-btn" class="hdr-btn plan-btn" type="button" aria-label="My plan" title="My plan"><span aria-hidden="true">♥</span><span class="plan-n"></span></button>
        <button id="notify-chip" class="hdr-btn" aria-pressed="true" hidden title="Notifications">🔔</button>
        <button id="theme-btn" class="hdr-btn theme-btn" type="button" aria-label="Theme"><span aria-hidden="true">🌓</span></button>
        <div class="menu-wrap">
          <button id="menu-btn" class="hdr-btn menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="More options">⋮</button>
          <div id="menu" class="menu" role="menu" hidden>
            <button id="hidden-chip" class="menu-item" role="menuitem" aria-pressed="false">Show hidden (0)</button>
            <button class="menu-item" role="menuitem" data-q="saved" data-menu-q="1">♥ Saved only</button>
            <button class="menu-item" role="menuitem" data-q="new" data-menu-q="1">✨ Found today</button>
          </div>
        </div>
      </div>
    </div>
    <div class="search-row">
      <label class="search-box">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Search events, venues, towns…" autocomplete="off" enterkeyhint="search" aria-label="Search" />
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>✕</button>
      </label>
    </div>
    <div class="where-row">
      <button id="where-btn" class="where-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="where-pin" aria-hidden="true">📍</span><span class="where-lbl">Where</span><span id="where-val" class="where-val">All of NI</span><span class="where-caret" aria-hidden="true"></span>
      </button>
      <div id="where-list" class="where-list" role="listbox" hidden></div>
    </div>
    <nav class="chips" id="quick-chips" aria-label="Filters"></nav>
    <div id="radius-row" class="radius-row" role="group" aria-label="Near me distance" hidden>
      <span class="radius-lbl">Within</span>
      <button class="rad" type="button" data-radius="5">5 mi</button><button class="rad" type="button" data-radius="10">10 mi</button><button class="rad" type="button" data-radius="25">25 mi</button><button class="rad" type="button" data-radius="50">50 mi</button><button class="rad" type="button" data-radius="0">Any</button>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner" role="status" hidden></div>
  <div class="status-row"><p id="status" class="status" role="status"></p><button id="clear-chip" class="expand-all clear-link" type="button" hidden>Clear filters</button><button id="view-toggle" class="expand-all view-toggle" type="button">🗺️ Map</button><button id="expand-all" class="expand-all" type="button" data-mode="expand" hidden>Expand all</button></div>
  <main id="list" class="event-list" aria-live="polite">
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
    <div class="card skeleton"><div class="sk sk-t"></div><div class="sk"></div><div class="sk sk-s"></div></div>
  </main>

  <div id="map-wrap" class="map-wrap" hidden><div id="map" class="map" role="region" aria-label="Map of events"></div>
    <div class="map-legend" aria-hidden="true"><span><i class="lg lg-sen"></i>SEN only</span><span><i class="lg lg-gen"></i>General</span><span><i class="lg lg-mix"></i>Both</span></div>
    <p class="map-note">Map tiles need a connection · pins show where each event or place is</p></div>

  <section id="detail" class="detail" hidden aria-modal="true" role="dialog"></section>

  <footer class="app-footer">
    <p>Past events hide automatically. The list updates when you're online.</p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
